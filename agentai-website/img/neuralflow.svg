<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 534" font-family="system-ui,-apple-system,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1c0808"/>
      <stop offset="100%" stop-color="#080202"/>
    </linearGradient>
    <linearGradient id="rg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8251a" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#e8251a" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="gg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#22c55e" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="chart-clip">
      <rect x="200" y="210" width="330" height="155"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="800" height="534" fill="url(#bg)"/>
  <ellipse cx="160" cy="240" rx="280" ry="220" fill="#e8251a" opacity="0.07"/>
  <ellipse cx="650" cy="150" rx="180" ry="150" fill="#e8251a" opacity="0.04"/>

  <!-- TOP NAV -->
  <rect width="800" height="46" fill="#110303" opacity="0.95"/>
  <circle cx="22" cy="23" r="7" fill="#e8251a"/>
  <rect cx="22" cy="23" width="4" height="4" rx="1" fill="white" x="20" y="21"/>
  <text x="36" y="28" fill="white" font-size="13" font-weight="700">NeuralFlow</text>
  <text x="340" y="28" fill="#555" font-size="11">Dashboard</text>
  <text x="406" y="28" fill="#444" font-size="11">Loans</text>
  <text x="450" y="28" fill="#444" font-size="11">Analytics</text>
  <text x="502" y="28" fill="#444" font-size="11">Reports</text>
  <rect x="694" y="12" width="90" height="22" rx="11" fill="#e8251a"/>
  <text x="739" y="27" fill="white" font-size="10" font-weight="600" text-anchor="middle">+ New Loan</text>

  <!-- SIDEBAR -->
  <rect x="0" y="46" width="168" height="488" fill="#0c0202" opacity="0.9"/>
  <rect x="0" y="72" width="168" height="32" fill="#e8251a" opacity="0.12"/>
  <rect x="10" y="80" width="3" height="16" rx="1.5" fill="#e8251a"/>
  <text x="22" y="93" fill="white" font-size="11" font-weight="600">Overview</text>
  <text x="18" y="128" fill="#3a3a3a" font-size="11">Underwriting</text>
  <text x="18" y="156" fill="#3a3a3a" font-size="11">Pipeline</text>
  <text x="18" y="184" fill="#3a3a3a" font-size="11">Decisions</text>
  <text x="18" y="212" fill="#3a3a3a" font-size="11">Risk Scoring</text>
  <text x="18" y="240" fill="#3a3a3a" font-size="11">Reports</text>

  <!-- STAT CARDS ROW -->
  <!-- Card: Avg Time -->
  <rect x="182" y="58" width="182" height="96" rx="10" fill="#180606" stroke="#280808" stroke-width="1"/>
  <text x="200" y="80" fill="#555" font-size="9" font-weight="600" letter-spacing="0.8">AVG DECISION TIME</text>
  <text x="200" y="118" fill="white" font-size="36" font-weight="800">4 min</text>
  <text x="200" y="140" fill="#e8251a" font-size="9">▼ was 3 days · 99.9% faster</text>

  <!-- Card: Approval Rate -->
  <rect x="374" y="58" width="182" height="96" rx="10" fill="#180606" stroke="#280808" stroke-width="1"/>
  <text x="392" y="80" fill="#555" font-size="9" font-weight="600" letter-spacing="0.8">APPROVAL RATE</text>
  <text x="392" y="118" fill="white" font-size="36" font-weight="800">87.3%</text>
  <text x="392" y="140" fill="#22c55e" font-size="9">▲ +4.2% this quarter</text>

  <!-- Card: Processed -->
  <rect x="566" y="58" width="218" height="96" rx="10" fill="#180606" stroke="#280808" stroke-width="1"/>
  <text x="584" y="80" fill="#555" font-size="9" font-weight="600" letter-spacing="0.8">LOANS PROCESSED</text>
  <text x="584" y="118" fill="white" font-size="36" font-weight="800">12,401</text>
  <text x="584" y="140" fill="#22c55e" font-size="9">▲ +340% throughput vs baseline</text>

  <!-- DECISION CHART -->
  <rect x="182" y="166" width="374" height="188" rx="10" fill="#180606" stroke="#280808" stroke-width="1"/>
  <text x="200" y="189" fill="white" font-size="12" font-weight="600">Decision Volume</text>
  <text x="480" y="189" fill="#e8251a" font-size="9">· Live</text>

  <!-- Grid lines -->
  <line x1="200" y1="210" x2="542" y2="210" stroke="#1e0606" stroke-width="1"/>
  <line x1="200" y1="232" x2="542" y2="232" stroke="#1e0606" stroke-width="1"/>
  <line x1="200" y1="254" x2="542" y2="254" stroke="#1e0606" stroke-width="1"/>
  <line x1="200" y1="276" x2="542" y2="276" stroke="#1e0606" stroke-width="1"/>
  <line x1="200" y1="298" x2="542" y2="298" stroke="#1e0606" stroke-width="1"/>
  <line x1="200" y1="320" x2="542" y2="320" stroke="#1e0606" stroke-width="1"/>

  <!-- Area fill approved -->
  <polygon points="200,318 248,298 296,272 344,284 392,258 440,242 488,236 540,228 540,340 200,340" fill="url(#rg)" opacity="0.45" clip-path="url(#chart-clip)"/>
  <!-- Line approved -->
  <polyline points="200,318 248,298 296,272 344,284 392,258 440,242 488,236 540,228" fill="none" stroke="#e8251a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" clip-path="url(#chart-clip)"/>
  <!-- Dot at end -->
  <circle cx="540" cy="228" r="4.5" fill="#e8251a"/>
  <circle cx="540" cy="228" r="8" fill="#e8251a" opacity="0.25"/>

  <!-- Area fill declined -->
  <polygon points="200,334 248,338 296,342 344,336 392,344 440,340 488,345 540,348 540,365 200,365" fill="url(#gg)" opacity="0.15" clip-path="url(#chart-clip)"/>
  <!-- Line declined -->
  <polyline points="200,334 248,338 296,342 344,336 392,344 440,340 488,345 540,348" fill="none" stroke="#22c55e" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="5,3" clip-path="url(#chart-clip)"/>

  <!-- X labels -->
  <text x="200" y="350" fill="#333" font-size="9">Mon</text>
  <text x="248" y="350" fill="#333" font-size="9">Tue</text>
  <text x="296" y="350" fill="#333" font-size="9">Wed</text>
  <text x="344" y="350" fill="#333" font-size="9">Thu</text>
  <text x="392" y="350" fill="#333" font-size="9">Fri</text>
  <text x="440" y="350" fill="#333" font-size="9">Sat</text>
  <text x="496" y="350" fill="#333" font-size="9">Today</text>

  <!-- DONUT CHART -->
  <rect x="566" y="166" width="218" height="188" rx="10" fill="#180606" stroke="#280808" stroke-width="1"/>
  <text x="584" y="189" fill="white" font-size="12" font-weight="600">Approval Score</text>
  <circle cx="675" cy="285" r="58" fill="none" stroke="#1e0606" stroke-width="18"/>
  <circle cx="675" cy="285" r="58" fill="none" stroke="#e8251a" stroke-width="18"
          stroke-dasharray="314 86" stroke-dashoffset="78" stroke-linecap="round"/>
  <text x="675" y="278" fill="white" font-size="22" font-weight="800" text-anchor="middle">87%</text>
  <text x="675" y="298" fill="#555" font-size="9" text-anchor="middle">approved</text>
  <text x="675" y="336" fill="#555" font-size="9" text-anchor="middle">13% declined</text>

  <!-- RECENT LOANS TABLE -->
  <rect x="182" y="364" width="602" height="136" rx="10" fill="#180606" stroke="#280808" stroke-width="1"/>
  <text x="200" y="386" fill="white" font-size="12" font-weight="600">Recent Decisions</text>

  <!-- Headers -->
  <text x="200" y="404" fill="#333" font-size="9" font-weight="600">LOAN ID</text>
  <text x="300" y="404" fill="#333" font-size="9" font-weight="600">TYPE</text>
  <text x="400" y="404" fill="#333" font-size="9" font-weight="600">AMOUNT</text>
  <text x="490" y="404" fill="#333" font-size="9" font-weight="600">DECISION</text>
  <text x="570" y="404" fill="#333" font-size="9" font-weight="600">TIME</text>
  <text x="620" y="404" fill="#333" font-size="9" font-weight="600">SCORE</text>
  <line x1="200" y1="408" x2="772" y2="408" stroke="#200808" stroke-width="1"/>

  <!-- Row 1 -->
  <rect x="192" y="414" width="4" height="22" rx="2" fill="#22c55e"/>
  <text x="200" y="430" fill="white" font-size="10">LN-48291</text>
  <text x="300" y="430" fill="#666" font-size="10">Home Loan</text>
  <text x="400" y="430" fill="#666" font-size="10">$240,000</text>
  <rect x="490" y="418" width="58" height="16" rx="8" fill="rgba(34,197,94,0.15)"/>
  <text x="519" y="430" fill="#22c55e" font-size="9" text-anchor="middle" font-weight="600">APPROVED</text>
  <text x="570" y="430" fill="#666" font-size="10">3.7 min</text>
  <text x="620" y="430" fill="#22c55e" font-size="10" font-weight="600">820</text>

  <!-- Row 2 -->
  <rect x="192" y="440" width="4" height="22" rx="2" fill="#f59e0b"/>
  <text x="200" y="456" fill="white" font-size="10">LN-48290</text>
  <text x="300" y="456" fill="#666" font-size="10">Auto Loan</text>
  <text x="400" y="456" fill="#666" font-size="10">$32,500</text>
  <rect x="490" y="444" width="58" height="16" rx="8" fill="rgba(245,158,11,0.15)"/>
  <text x="519" y="456" fill="#f59e0b" font-size="9" text-anchor="middle" font-weight="600">REVIEW</text>
  <text x="570" y="456" fill="#666" font-size="10">2.1 min</text>
  <text x="620" y="456" fill="#f59e0b" font-size="10" font-weight="600">682</text>

  <!-- Row 3 -->
  <rect x="192" y="466" width="4" height="22" rx="2" fill="#e8251a"/>
  <text x="200" y="482" fill="white" font-size="10">LN-48289</text>
  <text x="300" y="482" fill="#666" font-size="10">Personal</text>
  <text x="400" y="482" fill="#666" font-size="10">$15,200</text>
  <rect x="490" y="470" width="58" height="16" rx="8" fill="rgba(232,37,26,0.15)"/>
  <text x="519" y="482" fill="#e8251a" font-size="9" text-anchor="middle" font-weight="600">DECLINED</text>
  <text x="570" y="482" fill="#666" font-size="10">4.2 min</text>
  <text x="620" y="482" fill="#e8251a" font-size="10" font-weight="600">491</text>
</svg>
