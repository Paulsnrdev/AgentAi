  <ellipse cx="698" cy="265" rx="28" ry="12" fill="#1e3a6e" opacity="0.6"/>
  <rect x="672" y="254" width="52" height="18" rx="9" fill="#2563eb" opacity="0.8"/>
  <rect x="686" y="248" width="28" height="12" rx="6" fill="#3b82f6" opacity="0.9"/>
