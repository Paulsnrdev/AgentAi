  <line x1="748" y1="479" x2="748" y2="463" stroke="white" stroke-width="2" stroke-linecap="round"/>
  <polyline points="741,470 748,463 755,470" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
