<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 534" font-family="system-ui,-apple-system,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d0518"/>
      <stop offset="100%" stop-color="#060209"/>
    </linearGradient>
    <linearGradient id="pg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="534" fill="url(#bg)"/>
  <ellipse cx="600" cy="200" rx="300" ry="250" fill="#7c3aed" opacity="0.06"/>
  <ellipse cx="120" cy="400" rx="200" ry="180" fill="#a855f7" opacity="0.05"/>

  <!-- TOP NAV -->
  <rect width="800" height="46" fill="#07020e" opacity="0.95"/>
  <circle cx="22" cy="23" r="7" fill="#a855f7"/>
  <text x="36" y="28" fill="white" font-size="13" font-weight="700">DataSense</text>
  <text x="340" y="28" fill="#555" font-size="11">Patients</text>
  <text x="392" y="28" fill="#444" font-size="11">Risk Monitor</text>
  <text x="460" y="28" fill="#444" font-size="11">Vitals</text>
  <text x="502" y="28" fill="#444" font-size="11">Reports</text>
  <rect x="690" y="12" width="94" height="22" rx="11" fill="#7c3aed"/>
  <text x="737" y="27" fill="white" font-size="10" font-weight="600" text-anchor="middle">+ Add Patient</text>

  <!-- SIDEBAR -->
  <rect x="0" y="46" width="168" height="488" fill="#060110" opacity="0.95"/>
  <rect x="0" y="72" width="168" height="30" fill="#7c3aed" opacity="0.18"/>
  <rect x="10" y="80" width="3" height="14" rx="1.5" fill="#a855f7"/>
  <text x="22" y="91" fill="white" font-size="11" font-weight="600">Risk Monitor</text>
  <text x="18" y="122" fill="#2a2a2a" font-size="11">Patient List</text>
  <text x="18" y="148" fill="#2a2a2a" font-size="11">Vitals</text>
  <text x="18" y="174" fill="#2a2a2a" font-size="11">Alerts</text>
  <text x="18" y="200" fill="#2a2a2a" font-size="11">Lab Results</text>
  <text x="18" y="226" fill="#2a2a2a" font-size="11">Medications</text>

  <!-- Alert -->
  <rect x="10" y="452" width="148" height="50" rx="10" fill="rgba(239,68,68,0.12)" stroke="rgba(239,68,68,0.25)" stroke-width="1"/>
  <text x="22" y="470" fill="#ef4444" font-size="9" font-weight="700">⚠ 3 High Risk</text>
  <text x="22" y="485" fill="#555" font-size="9">Require attention now</text>

  <!-- STAT CARDS -->
  <rect x="182" y="58" width="155" height="88" rx="10" fill="#0a0518" stroke="#160a2a" stroke-width="1"/>
  <text x="198" y="78" fill="#555" font-size="9" font-weight="600" letter-spacing="0.8">HIGH RISK PATIENTS</text>
  <text x="198" y="114" fill="#ef4444" font-size="34" font-weight="800">3</text>
  <text x="198" y="134" fill="#ef4444" font-size="9">↑ predicted 14 days early</text>

  <rect x="347" y="58" width="155" height="88" rx="10" fill="#0a0518" stroke="#160a2a" stroke-width="1"/>
  <text x="363" y="78" fill="#555" font-size="9" font-weight="600" letter-spacing="0.8">READMISSION RATE</text>
  <text x="363" y="114" fill="white" font-size="34" font-weight="800">4.8%</text>
  <text x="363" y="134" fill="#22c55e" font-size="9">▼ −19% from baseline</text>

  <rect x="512" y="58" width="272" height="88" rx="10" fill="#0a0518" stroke="#160a2a" stroke-width="1"/>
  <text x="528" y="78" fill="#555" font-size="9" font-weight="600" letter-spacing="0.8">PREDICTION ACCURACY</text>
  <text x="528" y="114" fill="white" font-size="34" font-weight="800">94.7%</text>
  <text x="528" y="134" fill="#22c55e" font-size="9">▲ 14-day early warning window</text>

  <!-- RISK TIMELINE CHART -->
  <rect x="182" y="158" width="445" height="200" rx="10" fill="#0a0518" stroke="#160a2a" stroke-width="1"/>
  <text x="200" y="180" fill="white" font-size="12" font-weight="600">Patient Risk Score Timeline</text>
  <text x="560" y="180" fill="#a855f7" font-size="9">· 90 days</text>

  <!-- Grid lines -->
  <line x1="200" y1="200" x2="614" y2="200" stroke="#110522" stroke-width="1"/>
  <line x1="200" y1="222" x2="614" y2="222" stroke="#110522" stroke-width="1"/>
  <line x1="200" y1="244" x2="614" y2="244" stroke="#110522" stroke-width="1"/>
  <line x1="200" y1="266" x2="614" y2="266" stroke="#110522" stroke-width="1"/>
  <line x1="200" y1="288" x2="614" y2="288" stroke="#110522" stroke-width="1"/>
  <line x1="200" y1="310" x2="614" y2="310" stroke="#110522" stroke-width="1"/>

  <!-- Risk area (high risk patient) -->
  <polygon points="200,302 250,298 300,285 350,272 400,258 450,234 500,210 550,206 614,202 614,330 200,330" fill="url(#rg)" opacity="0.5"/>
  <polyline points="200,302 250,298 300,285 350,272 400,258 450,234 500,210 550,206 614,202" fill="none" stroke="#ef4444" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Normal risk line -->
  <polyline points="200,310 250,308 300,312 350,306 400,308 450,305 500,310 550,312 614,308" fill="none" stroke="#a855f7" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <polygon points="200,310 250,308 300,312 350,306 400,308 450,305 500,310 550,312 614,308 614,330 200,330" fill="url(#pg)" opacity="0.3"/>

  <!-- Alert marker (prediction point) -->
  <line x1="500" y1="200" x2="500" y2="330" stroke="#ef4444" stroke-width="1" stroke-dasharray="3,2"/>
  <rect x="476" y="192" width="72" height="16" rx="8" fill="rgba(239,68,68,0.2)" stroke="#ef4444" stroke-width="1"/>
  <text x="512" y="204" fill="#ef4444" font-size="8" text-anchor="middle" font-weight="600">⚠ Flagged</text>

  <!-- Endpoint dots -->
  <circle cx="614" cy="202" r="5" fill="#ef4444"/>
  <circle cx="614" cy="202" r="9" fill="#ef4444" opacity="0.2"/>
  <circle cx="614" cy="308" r="5" fill="#a855f7"/>

  <!-- Labels -->
  <text x="200" y="340" fill="#333" font-size="8">Day 1</text>
  <text x="362" y="340" fill="#333" font-size="8">Day 45</text>
  <text x="600" y="340" fill="#333" font-size="8">Day 90</text>
  <text x="198" y="204" fill="#333" font-size="8" text-anchor="end">100</text>
  <text x="198" y="266" fill="#333" font-size="8" text-anchor="end">50</text>
  <text x="198" y="328" fill="#333" font-size="8" text-anchor="end">0</text>

  <!-- Legend -->
  <line x1="200" y1="350" x2="218" y2="350" stroke="#ef4444" stroke-width="2"/>
  <text x="223" y="354" fill="#555" font-size="9">High-risk patient</text>
  <line x1="308" y1="350" x2="326" y2="350" stroke="#a855f7" stroke-width="2"/>
  <text x="331" y="354" fill="#555" font-size="9">Avg. cohort</text>

  <!-- PATIENT RISK LIST -->
  <rect x="637" y="158" width="147" height="200" rx="10" fill="#0a0518" stroke="#160a2a" stroke-width="1"/>
  <text x="653" y="180" fill="white" font-size="11" font-weight="600">Risk Queue</text>

  <!-- Patient 1 - high -->
  <rect x="645" y="190" width="131" height="50" rx="8" fill="#0d0620"/>
  <circle cx="660" cy="215" r="12" fill="#2d0a10"/>
  <text x="660" y="220" fill="#ef4444" font-size="10" text-anchor="middle" font-weight="700">JD</text>
  <text x="678" y="207" fill="white" font-size="9" font-weight="600">J. Davis, 67</text>
  <text x="678" y="220" fill="#555" font-size="8">Cardiac Ward</text>
  <rect x="678" y="225" width="46" height="12" rx="6" fill="rgba(239,68,68,0.2)"/>
  <text x="701" y="234" fill="#ef4444" font-size="7.5" text-anchor="middle" font-weight="700">HIGH 91</text>

  <!-- Patient 2 - medium -->
  <rect x="645" y="247" width="131" height="50" rx="8" fill="#0d0620"/>
  <circle cx="660" cy="272" r="12" fill="#1a1008"/>
  <text x="660" y="277" fill="#f59e0b" font-size="10" text-anchor="middle" font-weight="700">MK</text>
  <text x="678" y="264" fill="white" font-size="9" font-weight="600">M. Kim, 54</text>
  <text x="678" y="277" fill="#555" font-size="8">Pulmonology</text>
  <rect x="678" y="282" width="46" height="12" rx="6" fill="rgba(245,158,11,0.2)"/>
  <text x="701" y="291" fill="#f59e0b" font-size="7.5" text-anchor="middle" font-weight="700">MED 72</text>

  <!-- Patient 3 - low -->
  <rect x="645" y="304" width="131" height="50" rx="8" fill="#0d0620"/>
  <circle cx="660" cy="329" r="12" fill="#081808"/>
  <text x="660" y="334" fill="#22c55e" font-size="10" text-anchor="middle" font-weight="700">AR</text>
  <text x="678" y="321" fill="white" font-size="9" font-weight="600">A. Ross, 43</text>
  <text x="678" y="334" fill="#555" font-size="8">Orthopedics</text>
  <rect x="678" y="339" width="40" height="12" rx="6" fill="rgba(34,197,94,0.15)"/>
  <text x="698" y="348" fill="#22c55e" font-size="7.5" text-anchor="middle" font-weight="700">LOW 28</text>

  <!-- VITALS ROW -->
  <rect x="182" y="368" width="602" height="130" rx="10" fill="#0a0518" stroke="#160a2a" stroke-width="1"/>
  <text x="200" y="390" fill="white" font-size="12" font-weight="600">Live Vitals — J. Davis</text>
  <rect x="660" y="378" width="58" height="16" rx="8" fill="rgba(239,68,68,0.15)"/>
  <text x="689" y="389" fill="#ef4444" font-size="8" text-anchor="middle" font-weight="700">HIGH RISK</text>
  <rect x="726" y="378" width="42" height="16" rx="8" fill="rgba(34,197,94,0.12)"/>
  <circle cx="734" cy="386" r="3" fill="#22c55e"/>
  <text x="748" y="389" fill="#22c55e" font-size="8" font-weight="600">Live</text>

  <!-- Vital bars -->
  <!-- Heart Rate -->
  <text x="200" y="414" fill="#555" font-size="9">Heart Rate</text>
  <rect x="290" y="405" width="200" height="8" rx="4" fill="#160a2a"/>
  <rect x="290" y="405" width="142" height="8" rx="4" fill="#ef4444"/>
  <text x="500" y="414" fill="#ef4444" font-size="10" font-weight="600">98 bpm</text>
  <text x="570" y="414" fill="#555" font-size="8">↑ high</text>

  <!-- SpO2 -->
  <text x="200" y="436" fill="#555" font-size="9">SpO₂</text>
  <rect x="290" y="427" width="200" height="8" rx="4" fill="#160a2a"/>
  <rect x="290" y="427" width="184" height="8" rx="4" fill="#a855f7"/>
  <text x="500" y="436" fill="white" font-size="10" font-weight="600">92%</text>
  <text x="570" y="436" fill="#f59e0b" font-size="8">↓ watch</text>

  <!-- BP -->
  <text x="200" y="458" fill="#555" font-size="9">Blood Pressure</text>
  <rect x="290" y="449" width="200" height="8" rx="4" fill="#160a2a"/>
  <rect x="290" y="449" width="168" height="8" rx="4" fill="#7c3aed"/>
  <text x="500" y="458" fill="white" font-size="10" font-weight="600">148/92</text>
  <text x="570" y="458" fill="#ef4444" font-size="8">↑ elevated</text>

  <!-- Temp -->
  <text x="200" y="480" fill="#555" font-size="9">Temperature</text>
  <rect x="290" y="471" width="200" height="8" rx="4" fill="#160a2a"/>
  <rect x="290" y="471" width="110" height="8" rx="4" fill="#22c55e"/>
  <text x="500" y="480" fill="white" font-size="10" font-weight="600">37.1°C</text>
  <text x="570" y="480" fill="#22c55e" font-size="8">✓ normal</text>
</svg>
